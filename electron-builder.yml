appId: com.phoeshow.mydeepseekchat
# 显示名用于桌面条目；运行时的 app name 由 src/main/index.ts 里的 app.setName 固定为
# my-deepseek-chat，保证 userData 路径在开发态与打包态一致。
productName: DeepSeek Chat
copyright: Copyright © 2026 phoeshow

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  # better-sqlite3 运行时只会 require('prebuilds/<platform>-<arch>.node')（见其 lib/binding.js），
  # 源码/构建脚本/gyp 文件在打包产物里纯属死重，deps 里的 SQLite 合并源码就有 10MB。
  - '!node_modules/better-sqlite3/{deps,src,build}/**'
  - '!node_modules/better-sqlite3/binding.gyp'

# 原生模块必须解包到 asar 之外，否则 Electron 无法 dlopen
asarUnpack:
  - '**/*.node'
  - node_modules/better-sqlite3/**

linux:
  target:
    # AppImage 依赖 FUSE2（Arch 默认只有 fuse3，双击会报 libfuse.so.2 缺失），
    # 因此同时产出不依赖 FUSE、无需 root 的 tar.gz
    - AppImage
    - tar.gz
  category: Utility
  icon: build/icon.png
  synopsis: 本地运行的 DeepSeek 桌面聊天助手

mac:
  target: dmg
  category: public.app-category.productivity

win:
  target: nsis
